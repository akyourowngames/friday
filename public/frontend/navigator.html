<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#070908">
    <title>KING Navigator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="navigator.css?v=3">
</head>
<body>
    <main class="navigator-shell">
        <section class="route-stage" aria-label="Navigator route visualization">
            <canvas id="route-canvas"></canvas>
            <div class="stage-chrome">
                <header class="nav-header">
                    <a class="icon-link" href="index.html" title="Back to Jarvis" aria-label="Back to Jarvis">
                        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
                        </svg>
                    </a>
                    <div class="brand-block">
                        <span class="eyebrow">KING</span>
                        <h1>Navigator</h1>
                    </div>
                    <div class="status-chip" id="provider-status">
                        <span></span>
                        <strong>Ready</strong>
                    </div>
                </header>

                <form class="route-form" id="route-form">
                    <label>
                        <span>Origin</span>
                        <input id="origin-input" type="text" autocomplete="off" placeholder="Delhi" required>
                    </label>
                    <label>
                        <span>Destination</span>
                        <input id="destination-input" type="text" autocomplete="off" placeholder="Jaipur" required>
                    </label>
                    <div class="mode-control" aria-label="Route mode">
                        <button type="button" class="mode-pill active" data-mode="driving" title="Driving">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M5 17h14l-1.5-6h-11L5 17z"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="M7 11l2-4h6l2 4"/>
                            </svg>
                        </button>
                        <button type="button" class="mode-pill" data-mode="walking" title="Walking">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="13" cy="4" r="2"/><path d="M9 21l2-8-3-2 2-4 4 1 3 3"/><path d="M16 21l-3-5"/>
                            </svg>
                        </button>
                        <button type="button" class="mode-pill" data-mode="cycling" title="Cycling">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M8 17l4-8 3 8"/><path d="M12 9h4"/><path d="M11 6h2"/>
                            </svg>
                        </button>
                    </div>
                    <button class="submit-btn" type="submit" title="Calculate route">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 11l18-8-8 18-2-8-8-2z"/>
                        </svg>
                    </button>
                </form>

                <section class="route-readout" id="route-readout">
                    <article class="metric primary">
                        <span>Route</span>
                        <strong id="route-distance">--</strong>
                        <small id="route-distance-sub">waiting</small>
                    </article>
                    <article class="metric">
                        <span>Time</span>
                        <strong id="route-time">--</strong>
                        <small id="route-mode">driving</small>
                    </article>
                    <article class="metric">
                        <span>Direct</span>
                        <strong id="direct-distance">--</strong>
                        <small>line distance</small>
                    </article>
                </section>

                <section class="details-panel">
                    <div class="point-list">
                        <div class="point">
                            <span class="pin pin-origin"></span>
                            <div>
                                <small>From</small>
                                <strong id="origin-name">No origin yet</strong>
                            </div>
                        </div>
                        <div class="point">
                            <span class="pin pin-destination"></span>
                            <div>
                                <small>To</small>
                                <strong id="destination-name">No destination yet</strong>
                            </div>
                        </div>
                    </div>
                    <div class="provider-line" id="provider-line">Open provider route data will appear here.</div>
                    <div class="city-strip" id="city-strip" aria-live="polite"></div>
                </section>
            </div>
        </section>
    </main>
    <script src="navigator.js?v=3"></script>
</body>
</html>
