[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ares"
version = "0.1.0"
description = "A personal AI assistant that lives in your terminal"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "sentence-transformers[onnx]>=3.2",
    "sqlite-vec>=0.1",
    "httpx>=0.27",
    "pydantic>=2.0",
    "dateparser>=1.2",
    "tzlocal>=5.0",
    "plyer>=2.1",
    "ddgs>=9.0",
    "websockets>=12.0",
    "Pillow>=10.0",
    "pypdf>=5.0",
    "mcp>=1.28.0",
    "croniter>=2.0.0",
    "numpy>=1.26",
    "faster-whisper>=1.0",
    "cryptography>=42",
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
voice = [
    "edge-tts>=7.0",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "webrtcvad>=2.0",
]
telephony = [
    "livekit-agents>=1.0",
    "edge-tts>=7.0",
    "soundfile>=0.12",
]
# Compatibility extra retained for existing install commands. Watchers are now
# part of the normal Ares runtime rather than an independent optional feature.
watcher = []
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
ares = "ares.__main__:main"
ares-livekit = "ares.telephony.livekit_worker:main"
ares-livekit-room = "ares.telephony.livekit_room:main"
ares-livekit-token = "ares.telephony.livekit_token:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
