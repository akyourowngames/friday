name: update-readme

# Keeps README.md in sync with code changes on `ares`.
#
# The opencode GitHub App action only supports comment/PR/schedule/workflow_dispatch
# triggers — it hard-rejects `push` with "Unsupported event type: push". So we bridge
# it: a `push` to `ares` (excluding README-only pushes) dispatches a `workflow_dispatch`
# run of THIS workflow, and that run lets opencode review the diff and rewrite any
# README sections whose behavior changed, then commit the update back.
#
# Why the bridge works: the `push` event simply calls `gh workflow run` to start a
# `workflow_dispatch` run, which is in the action's supported event list.
#
# Loop prevention (defense in depth):
#   1. `paths-ignore: ['README.md']` means a push that only touches README.md
#      (including opencode's own commit) does not re-trigger this workflow at all.
#   2. The push-triggered `trigger` job only runs for non-bot actors.
#   3. The prompt forces a `[skip ci]` commit message, which makes GitHub skip
#      all workflow runs for that commit regardless.

on:
  push:
    branches: [ares]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  id-token: write

jobs:
  trigger:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch README update run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run update-readme.yml --ref ares

  update:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Update README via opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/deepseek-v4-flash-free
          use_github_token: true
          prompt: |
            The `ares` branch just received new commits. Review the most recent
            commit(s) on this branch (compare HEAD against the previous state)
            and update README.md so its prose and sections accurately reflect
            what actually changed.

            Rules:
            - Only modify README.md. Never touch other files.
            - Update any section whose underlying behavior changed (capabilities,
              features, configuration, usage, architecture, installation).
            - Do NOT invent or advertise features that were not added in this push.
            - Preserve the existing structure, tone, and Markdown formatting;
              keep hand-written prose intact and only adjust what the diff affects.
            - If the diff does not change anything user-facing that the README
              describes, make no changes and stop.

            When you have made the necessary edits, commit them with a message
            that includes the literal token `[skip ci]` (for example:
            "docs(readme): sync documentation with push [skip ci]") and push the
            commit to the current branch.
