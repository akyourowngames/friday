name: update-readme

# Keeps README.md in sync with code changes. Whenever commits land on `ares`
# (excluding README-only pushes), opencode reviews the diff and rewrites any
# sections whose underlying behavior changed, then commits the update back.
#
# Loop prevention (defense in depth):
#   1. `paths-ignore: ['README.md']` means a push that only touches README.md
#      (including opencode's own commit) does not re-trigger this workflow.
#   2. `if: github.actor != 'github-actions[bot]'` skips runs caused by the
#      bot's own push via GITHUB_TOKEN.
#   3. The prompt forces a `[skip ci]` commit message, which makes GitHub skip
#      all workflow runs for that commit regardless.

on:
  push:
    branches: [ares]
    paths-ignore:
      - 'README.md'

permissions:
  contents: write
  id-token: write

jobs:
  update-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Update README via opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/deepseek-v4-flash-free
          use_github_token: true
          prompt: |
            A push just landed on the `ares` branch. Review the changes in this
            push (compare the pushed commits against the previous state of the
            branch) and update README.md so its prose and sections accurately
            reflect what actually changed.

            Rules:
            - Only modify README.md. Never touch other files.
            - Update any section whose underlying behavior changed (capabilities,
              features, configuration, usage, architecture, installation).
            - Do NOT invent or advertise features that were not added in this push.
            - Preserve the existing structure, tone, and Markdown formatting;
              keep hand-written prose intact and only adjust what the diff affects.
            - If the diff does not change anything user-facing that the README
              describes, make no changes and stop.

            When you have made the necessary edits, commit them with a message
            that includes the literal token `[skip ci]` (for example:
            "docs(readme): sync documentation with push [skip ci]") and push the
            commit to the current branch.
