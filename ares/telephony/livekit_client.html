<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ares Voice Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            padding: 2rem;
        }
        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: #00d4aa;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }
        .setup-form {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 0.3rem;
        }
        input, textarea {
            width: 100%;
            padding: 0.7rem;
            border: 1px solid #333;
            border-radius: 8px;
            background: #0d0d1a;
            color: #e0e0e0;
            font-size: 0.95rem;
            font-family: monospace;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #00d4aa;
        }
        .btn {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #00d4aa;
            color: #000;
        }
        .btn-primary:hover { background: #00eabb; }
        .btn-primary:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }
        .btn-danger {
            background: #ff4444;
            color: #fff;
            margin-top: 0.5rem;
        }
        .btn-danger:hover { background: #ff6666; }

        .call-area {
            display: none;
            text-align: center;
        }
        .call-area.active { display: block; }

        .voice-indicator {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #1a1a2e;
            border: 3px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            transition: all 0.3s;
        }
        .voice-indicator.listening {
            border-color: #00d4aa;
            box-shadow: 0 0 30px rgba(0, 212, 170, 0.3);
            animation: pulse 1.5s infinite;
        }
        .voice-indicator.speaking {
            border-color: #ffaa00;
            box-shadow: 0 0 30px rgba(255, 170, 0, 0.3);
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .mic-icon {
            font-size: 3rem;
        }

        .transcript-area {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 1rem;
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 1rem;
            text-align: left;
        }
        .transcript-msg {
            padding: 0.5rem 0;
            border-bottom: 1px solid #222;
        }
        .transcript-msg:last-child { border-bottom: none; }
        .transcript-role {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 0.2rem;
        }
        .transcript-role.user { color: #00d4aa; }
        .transcript-role.agent { color: #ffaa00; }
        .transcript-role.system { color: #888; }
        .transcript-text {
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .status-bar {
            text-align: center;
            font-size: 0.8rem;
            color: #666;
            margin-top: 1rem;
        }
        .status-bar.connected { color: #00d4aa; }
        .status-bar.error { color: #ff4444; }
        #audioOutput { display: none; }
        #enableAudioBtn { display: none; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Ares Voice Assistant</h1>
        <p class="subtitle">Real-time voice chat powered by LiveKit</p>

        <!-- Setup Form -->
        <div class="setup-form" id="setupForm">
            <div class="form-group">
                <label for="roomInput">Room Name</label>
                <input type="text" id="roomInput" value="ares-voice-room" placeholder="Room name">
            </div>
            <div class="form-group">
                <label for="identityInput">Your Identity</label>
                <input type="text" id="identityInput" value="ares-user" placeholder="Your name or device identity">
            </div>
            <button class="btn btn-primary" id="joinBtn" onclick="joinRoom()">
                Connect to Ares
            </button>
        </div>

        <!-- Call Area -->
        <div class="call-area" id="callArea">
            <div class="voice-indicator" id="voiceIndicator">
                <span class="mic-icon">🎙️</span>
            </div>

            <div class="transcript-area" id="transcriptArea">
                <div class="transcript-msg">
                    <div class="transcript-role system">System</div>
                    <div class="transcript-text">Join the room to start talking...</div>
                </div>
            </div>

            <button class="btn btn-primary" id="muteBtn" onclick="toggleMute()">
                🔇 Mute
            </button>
            <button class="btn btn-primary" id="enableAudioBtn" onclick="enableAudio()">
                🔊 Enable Ares audio
            </button>
            <button class="btn btn-danger" onclick="leaveRoom()">
                Leave Room
            </button>
            <div id="audioOutput" aria-live="polite"></div>
        </div>

        <div class="status-bar" id="statusBar">Ready to connect</div>
    </div>

    <script>
        let room = null;
        let localTrack = null;
        let isMuted = false;
        const attachedAudioElements = new Set();

        const LivekitClient = window.LivekitClient;

        function setStatus(text, type = '') {
            const bar = document.getElementById('statusBar');
            bar.textContent = text;
            bar.className = 'status-bar' + (type ? ' ' + type : '');
        }

        function addTranscript(role, text) {
            const area = document.getElementById('transcriptArea');
            const msg = document.createElement('div');
            msg.className = 'transcript-msg';
            msg.innerHTML = `
                <div class="transcript-role ${role}">${role}</div>
                <div class="transcript-text">${escapeHtml(text)}</div>
            `;
            area.appendChild(msg);
            area.scrollTop = area.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function setVoiceState(state) {
            const indicator = document.getElementById('voiceIndicator');
            indicator.className = 'voice-indicator' + (state ? ' ' + state : '');
        }

        function showAudioUnlock(text) {
            document.getElementById('enableAudioBtn').style.display = 'block';
            setStatus(text, 'error');
        }

        async function playRemoteAudio(audioEl) {
            audioEl.autoplay = true;
            audioEl.muted = false;
            audioEl.volume = 1;
            try {
                await audioEl.play();
                document.getElementById('enableAudioBtn').style.display = 'none';
                setStatus('Ares audio is playing', 'connected');
            } catch (error) {
                console.warn('Browser blocked remote audio playback:', error);
                showAudioUnlock('Browser blocked Ares audio. Click “Enable Ares audio”.');
            }
        }

        async function requestRoomSession(roomName, identity) {
            const query = new URLSearchParams({ room: roomName, identity });
            const response = await fetch('/api/livekit/session?' + query.toString(), {
                cache: 'no-store',
                credentials: 'same-origin',
            });
            const payload = await response.json();
            if (!response.ok) {
                throw new Error(payload.detail || 'Could not create a LiveKit room session.');
            }
            return payload;
        }

        async function joinRoom() {
            const roomName = document.getElementById('roomInput').value.trim();
            const identity = document.getElementById('identityInput').value.trim();

            if (!roomName || !identity) {
                alert('Room name and identity are required.');
                return;
            }

            document.getElementById('joinBtn').disabled = true;
            setStatus('Connecting...');

            try {
                const session = await requestRoomSession(roomName, identity);
                room = new LivekitClient.Room({
                    adaptiveStream: true,
                    dynacast: true,
                });

                // Handle events
                room.on(LivekitClient.RoomEvent.Connected, () => {
                    setStatus('Connected to room: ' + room.name, 'connected');
                    document.getElementById('setupForm').style.display = 'none';
                    document.getElementById('callArea').classList.add('active');
                    addTranscript('system', 'Connected! Start speaking...');
                });

                room.on(LivekitClient.RoomEvent.Disconnected, (reason) => {
                    setStatus('Disconnected: ' + (reason || 'connection ended'), 'error');
                    cleanup();
                });

                room.on(LivekitClient.RoomEvent.TrackSubscribed, async (track, publication, participant) => {
                    if (track.kind === 'audio') {
                        const audioEl = track.attach();
                        audioEl.dataset.livekitTrack = publication.trackSid || participant.identity;
                        document.getElementById('audioOutput').appendChild(audioEl);
                        attachedAudioElements.add(audioEl);
                        setVoiceState('speaking');
                        await playRemoteAudio(audioEl);
                        track.on(LivekitClient.TrackEvent.Muted, () => setVoiceState('listening'));
                        track.on(LivekitClient.TrackEvent.Unmuted, () => setVoiceState('speaking'));
                    }
                });

                room.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track) => {
                    track.detach().forEach(el => {
                        attachedAudioElements.delete(el);
                        el.remove();
                    });
                });

                // Data channel for transcriptions
                room.on(LivekitClient.RoomEvent.DataReceived, (payload, participant, kind, topic) => {
                    try {
                        const text = new TextDecoder().decode(payload);
                        const data = JSON.parse(text);
                        if (data.type === 'transcription' || data.transcript) {
                            const role = participant?.identity === 'ares-agent' ? 'agent' : 'user';
                            addTranscript(role, data.transcript || data.text || text);
                        }
                    } catch (e) {
                        // Plain text data
                        addTranscript('system', new TextDecoder().decode(payload));
                    }
                });

                // Transcription events (if using LiveKit's built-in transcription)
                room.on(LivekitClient.RoomEvent.TranscriptionReceived, (segments, participant) => {
                    for (const seg of segments) {
                        const role = participant?.identity === 'ares-agent' ? 'agent' : 'user';
                        if (seg.final) {
                            addTranscript(role, seg.text);
                        }
                    }
                });

                // Connect to room with URL and token
                await room.connect(session.livekit_url, session.token);

                // Must run directly in the Connect button's user gesture. This
                // unlocks audio on browsers that block autoplay on page load.
                if (typeof room.startAudio === 'function') {
                    try {
                        await room.startAudio();
                    } catch (error) {
                        console.warn('Could not unlock room audio:', error);
                        showAudioUnlock('Click “Enable Ares audio” to allow playback.');
                    }
                }

                // Publish microphone
                await room.localParticipant.setMicrophoneEnabled(true);
                localTrack = room.localParticipant.getTrackPublication('microphone');
                setStatus('Microphone active', 'connected');

            } catch (error) {
                console.error('Failed to connect:', error);
                setStatus('Error: ' + error.message, 'error');
                document.getElementById('joinBtn').disabled = false;
            }
        }

        function toggleMute() {
            if (!room) return;
            isMuted = !isMuted;
            room.localParticipant.setMicrophoneEnabled(!isMuted);
            const btn = document.getElementById('muteBtn');
            btn.textContent = isMuted ? '🔊 Unmute' : '🔇 Mute';
        }

        async function enableAudio() {
            if (!room) return;
            try {
                if (typeof room.startAudio === 'function') {
                    await room.startAudio();
                }
                await Promise.all([...attachedAudioElements].map((audioEl) => audioEl.play()));
                document.getElementById('enableAudioBtn').style.display = 'none';
                setStatus('Ares audio enabled', 'connected');
            } catch (error) {
                console.error('Could not enable Ares audio:', error);
                showAudioUnlock('Audio is still blocked. Allow sound for this tab, then click again.');
            }
        }

        async function leaveRoom() {
            if (room) {
                await room.disconnect();
            }
            cleanup();
        }

        function cleanup() {
            if (room) {
                room.removeAllListeners();
                room = null;
            }
            localTrack = null;
            isMuted = false;
            attachedAudioElements.forEach((audioEl) => audioEl.remove());
            attachedAudioElements.clear();
            document.getElementById('audioOutput').replaceChildren();
            document.getElementById('enableAudioBtn').style.display = 'none';
            document.getElementById('setupForm').style.display = 'block';
            document.getElementById('callArea').classList.remove('active');
            document.getElementById('joinBtn').disabled = false;
            setVoiceState('');
            document.getElementById('transcriptArea').innerHTML = `
                <div class="transcript-msg">
                    <div class="transcript-role system">System</div>
                    <div class="transcript-text">Join the room to start talking...</div>
                </div>
            `;
        }

        // The local launcher never puts the JWT in the URL. It issues a short-lived
        // token through its loopback-only endpoint after the user clicks Connect.
        const params = new URLSearchParams(window.location.search);
        if (params.get('room')) {
            document.getElementById('roomInput').value = params.get('room');
        }
        if (params.get('identity')) {
            document.getElementById('identityInput').value = params.get('identity');
        }
    </script>
</body>
</html>
