<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- orbit rings -->
  <circle cx="1010" cy="160" r="120" fill="none" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="1.5"/>
  <circle cx="1010" cy="160" r="80" fill="none" stroke="#a855f7" stroke-opacity="0.22" stroke-width="1.5"/>
  <circle cx="1010" cy="160" r="9" fill="#38bdf8"/>
  <circle cx="1090" cy="160" r="5" fill="#a855f7"/>
  <circle cx="1010" cy="80" r="4" fill="#f472b6"/>

  <!-- title -->
  <text x="64" y="120" fill="#f8fafc" font-size="78" font-weight="800" letter-spacing="-2">Ares</text>
  <rect x="64" y="140" width="220" height="6" rx="3" fill="url(#accent)"/>
  <text x="64" y="186" fill="#cbd5e1" font-size="26" font-weight="500">Local-first personal AI assistant</text>
  <text x="64" y="222" fill="#94a3b8" font-size="20">Terminal · Desktop voice · Web workspace · Phone · Telegram · Telephony</text>

  <!-- pillars -->
  <text x="64" y="278" fill="#a855f7" font-size="19" font-weight="700">⌁ Recall</text>
  <text x="244" y="278" fill="#38bdf8" font-size="19" font-weight="700">⚡ Act</text>
  <text x="404" y="278" fill="#f472b6" font-size="19" font-weight="700">✦ Extend</text>
</svg>
